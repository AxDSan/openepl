[package]
name = "openepl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openepl"
path = "src/main.rs"

[dependencies]
openepl-ir = { path = "../ir" }
openepl-backend = { path = "../backend" }
openepl-debug = { path = "../debug" }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
